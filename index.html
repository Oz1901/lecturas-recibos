<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lectura de Recibos 2025</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 20px;
}

.container {
  background: #fff;
  max-width: 950px;
  margin: auto;
  padding: 20px;
  border-radius: 8px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
}

th {
  background: #eaeaea;
}

.servicio {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: bold;
}

.servicio img {
  width: 28px;
  height: 28px;
}

input {
  width: 100%;
  padding: 4px;
  text-align: right;
  box-sizing: border-box;
}

.total-servicio {
  text-align: right;
  font-weight: bold;
}

.resumen {
  width: 300px;
  margin-left: auto;
  margin-top: 20px;
}

.resumen div {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
}

.total-final {
  font-size: 18px;
  font-weight: bold;
  border-top: 2px solid #000;
  padding-top: 8px;
}
</style>
</head>

<body>

<div class="container">
  <h2>MODELO RECIBO 2025</h2>

  <table>
    <thead>
      <tr>
        <th>Servicio</th>
        <th>Importe</th>
        <th>Descuento</th>
        <th>Total (IGV incluido)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="servicio"><img src="img/internet.png">PLAN INTERNET</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio">0.00</td>
      </tr>
      <tr>
        <td class="servicio"><img src="img/tv.png">TV WIN / DIRECTV</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio">0.00</td>
      </tr>
      <tr>
        <td class="servicio"><img src="img/winbox.png">WIN BOX</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio">0.00</td>
      </tr>
      <tr>
        <td class="servicio"><img src="img/mesh.png">MESH</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio">0.00</td>
      </tr>
      <tr>
        <td class="servicio"><img src="img/fono.png">FONO WIN</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio">0.00</td>
      </tr>
      <tr>
        <td class="servicio"><img src="img/reconexion.png">RECONEXIÓN</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio">0.00</td>
      </tr>
      <tr>
        <td class="servicio"><img src="img/instalacion.png">INSTALACIÓN</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio">0.00</td>
      </tr>
    </tbody>
  </table>

  <div class="resumen">
    <div class="total-final">
      <span>TOTAL FINAL</span>
      <span>S/ <span id="totalFinal">0.00</span></span>
    </div>
  </div>
</div>

<script>
function calcular() {
  let totalFinal = 0;

  document.querySelectorAll("tbody tr").forEach(row => {
    const importe = parseFloat(row.cells[1].querySelector("input").value) || 0;
    const descuento = parseFloat(row.cells[2].querySelector("input").value) || 0;

    const base = importe - descuento;
    const totalServicio = base + (base * 0.18);

    row.cells[3].textContent = totalServicio.toFixed(2);
    totalFinal += totalServicio;
  });

  document.getElementById("totalFinal").textContent = totalFinal.toFixed(2);
}
</script>

</body>
</html>
