<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lectura de Recibos 2025</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 15px;
}

.container {
  background: #fff;
  max-width: 1000px;
  margin: auto;
  padding: 15px;
  border-radius: 8px;
}

h2 {
  text-align: center;
  margin-bottom: 15px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}

th {
  background: #eaeaea;
}

.servicio {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: bold;
  text-align: left;
}

.servicio img {
  width: 26px;
  height: 26px;
  object-fit: contain;
}

input {
  width: 100%;
  padding: 4px;
  text-align: right;
  box-sizing: border-box;
}

.total-servicio {
  font-weight: bold;
}

.resumen {
  max-width: 320px;
  margin-left: auto;
  margin-top: 15px;
}

.resumen div {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
}

.total-final {
  font-size: 18px;
  font-weight: bold;
  border-top: 2px solid #000;
  padding-top: 8px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {

  table, thead, tbody, th, tr {
    display: block;
  }

  thead {
    display: none;
  }

  tr {
    border: 1px solid #ccc;
    margin-bottom: 12px;
    border-radius: 6px;
    padding: 10px;
  }

  td {
    border: none;
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
  }

  td::before {
    content: attr(data-label);
    font-weight: bold;
    text-align: left;
  }

  .servicio {
    justify-content: flex-start;
  }

  .resumen {
    max-width: 100%;
  }
}
</style>
</head>
