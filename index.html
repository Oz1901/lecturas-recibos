<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lectura de Recibos 2025</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 20px;
}

.container {
  background: #fff;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  border-radius: 8px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
}

th {
  background: #eaeaea;
  text-align: center;
}

td:first-child {
  font-weight: bold;
}

input {
  width: 100%;
  padding: 4px;
  text-align: right;
  box-sizing: border-box;
}

.subtotal {
  text-align: right;
  font-weight: bold;
}

.resumen {
  width: 300px;
  margin-left: auto;
  margin-top: 20px;
}

.resumen div {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
}

.total {
  font-size: 18px;
  font-weight: bold;
  border-top: 2px solid #000;
  padding-top: 8px;
}
</style>
</head>

<body>

<div class="container">
  <h2>MODELO RECIBO 2025</h2>

  <table>
    <thead>
      <tr>
        <th>Servicio</th>
        <th>Importe</th>
        <th>Descuento</th>
        <th>Subtotal</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>PLAN INTERNET</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="subtotal">0.00</td>
      </tr>
      <tr>
        <td>TV WIN / DIRECTV</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="subtotal">0.00</td>
      </tr>
      <tr>
        <td>WIN BOX</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="subtotal">0.00</td>
      </tr>
      <tr>
        <td>MESH</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="subtotal">0.00</td>
      </tr>
      <tr>
        <td>FONO WIN</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="subtotal">0.00</td>
      </tr>
      <tr>
        <td>RECONEXIÓN</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="subtotal">0.00</td>
      </tr>
      <tr>
        <td>INSTALACIÓN</td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td><input type="number" value="0" oninput="calcular()"></td>
        <td class="subtotal">0.00</td>
      </tr>
    </tbody>
  </table>

  <div class="resumen">
    <div>
      <span>Subtotal</span>
      <span>S/ <span id="subGeneral">0.00</span></span>
    </div>
    <div>
      <span>IGV (18%)</span>
      <span>S/ <span id="igv">0.00</span></span>
    </div>
    <div class="total">
      <span>Total</span>
      <span>S/ <span id="total">0.00</span></span>
    </div>
  </div>
</div>

<script>
function calcular() {
  let subtotalGeneral = 0;

  document.querySelectorAll("tbody tr").forEach(row => {
    const importe = parseFloat(row.cells[1].querySelector("input").value) || 0;
    const descuento = parseFloat(row.cells[2].querySelector("input").value) || 0;

    const subtotal = importe - descuento;
    row.cells[3].textContent = subtotal.toFixed(2);

    subtotalGeneral += subtotal;
  });

  const igv = subtotalGeneral * 0.18;
  const total = subtotalGeneral + igv;

  document.getElementById("subGeneral").textContent = subtotalGeneral.toFixed(2);
  document.getElementById("igv").textContent = igv.toFixed(2);
  document.getElementById("total").textContent = total.toFixed(2);
}
</script>

</body>
</html>
