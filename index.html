<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lectura de Recibos 2025</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;

  }

  .recibo {
    background: #fff;

    margin: auto;
    padding: 20px;
    border-radius: 8px;
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
  }

  th {
    background: #eaeaea;
  }

  td:first-child {
    text-align: left;
    font-weight: bold;
  }

  input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 4px;
    text-align: right;
  }

  .totales {
    margin-top: 20px;
    max-width: 300px;
    margin-left: auto;
  }

  .totales div {
    display: flex;
    justify-content: space-between;
    margin: 6px 0;
    font-size: 16px;
  }

  .total-final {
    font-size: 18px;
    font-weight: bold;
    border-top: 2px solid #000;
    padding-top: 8px;
  }
</style>
</head>
