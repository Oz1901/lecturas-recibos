<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lectura de Recibos 2025</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 15px;
}

.container {
  background: #fff;
  max-width: 1000px;
  margin: auto;
  padding: 15px;
  border-radius: 8px;
}

h2 {
  text-align: center;
  margin-bottom: 15px;
}

button {
  background: #007bff;
  color: #fff;
  border: none;
  padding: 10px 16px;
  border-radius: 5px;
  cursor: pointer;
  margin-bottom: 15px;
}

button:hover {
  background: #0056b3;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}

th {
  background: #eaeaea;
}

.servicio {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: bold;
  text-align: left;
}

.servicio img {
  width: 26px;
  height: 26px;
  object-fit: contain;
}

input {
  width: 100%;
  padding: 4px;
  text-align: right;
  box-sizing: border-box;
}

.total-servicio {
  font-weight: bold;
}

.resumen {
  max-width: 320px;
  margin-left: auto;
  margin-top: 15px;
}

.resumen div {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
}

.total-final {
  font-size: 18px;
  font-weight: bold;
  border-top: 2px solid #000;
  padding-top: 8px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {

  table, thead, tbody, th, tr {
    display: block;
  }

  thead {
    display: none;
  }

  tr {
    border: 1px solid #ccc;
    margin-bottom: 12px;
    border-radius: 6px;
    padding: 10px;
  }

  td {
    border: none;
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
  }

  td::before {
    content: attr(data-label);
    font-weight: bold;
    text-align: left;
  }

  .servicio {
    justify-content: flex-start;
  }

  .resumen {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<div class="container" id="recibo">
  <h2>MODELO RECIBO 2025</h2>

  <button onclick="exportarPDF()">Exportar a PDF</button>

  <table>
    <thead>
      <tr>
        <th>Servicio</th>
        <th>Importe</th>
        <th>Descuento</th>
        <th>Total (IGV incluido)</th>
      </tr>
    </thead>
    <tbody>

      <tr>
        <td class="servicio" data-label="Servicio"><img src="img/internet.png"> PLAN INTERNET</td>
        <td data-label="Importe"><input type="number" value="0" oninput="calcular()"></td>
        <td data-label="Descuento"><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio" data-label="Total">0.00</td>
      </tr>

      <tr>
        <td class="servicio" data-label="Servicio"><img src="img/tv.png"> TV WIN / DIRECTV</td>
        <td data-label="Importe"><input type="number" value="0" oninput="calcular()"></td>
        <td data-label="Descuento"><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio" data-label="Total">0.00</td>
      </tr>

      <tr>
        <td class="servicio" data-label="Servicio"><img src="img/winbox.png"> WIN BOX</td>
        <td data-label="Importe"><input type="number" value="0" oninput="calcular()"></td>
        <td data-label="Descuento"><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio" data-label="Total">0.00</td>
      </tr>

      <tr>
        <td class="servicio" data-label="Servicio"><img src="img/mesh.png"> MESH</td>
        <td data-label="Importe"><input type="number" value="0" oninput="calcular()"></td>
        <td data-label="Descuento"><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio" data-label="Total">0.00</td>
      </tr>

      <tr>
        <td class="servicio" data-label="Servicio"><img src="img/fono.png"> FONO WIN</td>
        <td data-label="Importe"><input type="number" value="0" oninput="calcular()"></td>
        <td data-label="Descuento"><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio" data-label="Total">0.00</td>
      </tr>

      <tr>
        <td class="servicio" data-label="Servicio"><img src="img/reconexion.png"> RECONEXIÓN</td>
        <td data-label="Importe"><input type="number" value="0" oninput="calcular()"></td>
        <td data-label="Descuento"><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio" data-label="Total">0.00</td>
      </tr>

      <tr>
        <td class="servicio" data-label="Servicio"><img src="img/instalacion.png"> INSTALACIÓN</td>
        <td data-label="Importe"><input type="number" value="0" oninput="calcular()"></td>
        <td data-label="Descuento"><input type="number" value="0" oninput="calcular()"></td>
        <td class="total-servicio" data-label="Total">0.00</td>
      </tr>

    </tbody>
  </table>

  <div class="resumen">
    <div class="total-final">
      <span>TOTAL FINAL</span>
      <span>S/ <span id="totalFinal">0.00</span></span>
    </div>
  </div>
</div>

<!-- LIBRERÍAS PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
function calcular() {
  let totalFinal = 0;

  document.querySelectorAll("tbody tr").forEach(row => {
    const importe = parseFloat(row.querySelector('td[data-label="Importe"] input').value) || 0;
    const descuento = parseFloat(row.querySelector('td[data-label="Descuento"] input').value) || 0;

    const base = importe - descuento;
    const totalServicio = base + (base * 0.18);

    row.querySelector('.total-servicio').textContent = totalServicio.toFixed(2);
    totalFinal += totalServicio;
  });

  document.getElementById("totalFinal").textContent = totalFinal.toFixed(2);
}

function exportarPDF() {
  const { jsPDF } = window.jspdf;
  const recibo = document.getElementById("recibo");

  html2canvas(recibo, { scale: 2 }).then(canvas => {
    const imgData = canvas.toDataURL("image/png");
    const pdf = new jsPDF("p", "mm", "a4");

    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = (canvas.height * pageWidth) / canvas.width;

    pdf.addImage(imgData, "PNG", 0, 0, pageWidth, pageHeight);
    pdf.save("recibo_2025.pdf");
  });
}
</script>

</body>
</html>
